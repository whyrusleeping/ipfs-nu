# Release: static Linux tarballs, macOS per-arch and universal tarballs (signed and
# notarized when the signing secrets exist), SHA256SUMS, and a draft GitHub release.
# Secrets are referenced by NAME only; with none configured the macOS binaries ship
# unsigned and the job says so. What a human must provide: docs/operations.md
# "Distribution".
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to stamp (e.g. v0.1.0-rc1); default the tag or dev-<sha>
        required: false
permissions:
  contents: read
env:
  CGO_ENABLED: '0'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - id: v
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || { [ "${GITHUB_REF_TYPE}" = tag ] && v="${GITHUB_REF_NAME}"; }
          [ -n "$v" ] || v="dev-${GITHUB_SHA::12}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: go test ./...
      - run: scripts/release.sh build "${{ steps.v.outputs.version }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: out/bin

  macos:
    needs: build
    runs-on: macos-latest
    env:
      # Names of the repository secrets; values never appear in this file.
      MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: out/bin
      - name: universal binary
        run: |
          mkdir -p out/bin/darwin_universal
          lipo -create -output out/bin/darwin_universal/nu out/bin/darwin_amd64/nu out/bin/darwin_arm64/nu
          chmod 0755 out/bin/darwin_*/nu
          lipo -info out/bin/darwin_universal/nu
      - name: native smoke test
        run: |
          out/bin/darwin_universal/nu version
          export NU_PATH="$RUNNER_TEMP/nu"
          echo hello > "$RUNNER_TEMP/hello.txt"
          out/bin/darwin_universal/nu add "$RUNNER_TEMP/hello.txt"
          out/bin/darwin_universal/nu repo backup "$RUNNER_TEMP/backup.tar"
          out/bin/darwin_universal/nu repo export "$RUNNER_TEMP/export"
      - name: sign
        if: env.MACOS_SIGN_P12_BASE64 != ''
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw="$(uuidgen)"
          echo "$MACOS_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sign.p12"
          for b in out/bin/darwin_*/nu; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
      - name: notarize
        if: env.MACOS_SIGN_P12_BASE64 != '' && env.MACOS_NOTARY_APPLE_ID != ''
        run: |
          # Bare binaries cannot be stapled; Gatekeeper checks the ticket online.
          for d in out/bin/darwin_*; do
            ditto -c -k --keepParent "$d/nu" "$RUNNER_TEMP/$(basename "$d").zip"
            xcrun notarytool submit "$RUNNER_TEMP/$(basename "$d").zip" --wait \
              --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD"
          done
          spctl --assess --type install --verbose out/bin/darwin_universal/nu || true
      - name: unsigned notice
        if: env.MACOS_SIGN_P12_BASE64 == ''
        run: echo "::warning::macOS binaries are NOT signed or notarized (MACOS_SIGN_* secrets not configured)"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-darwin
          path: out/bin/darwin_*

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: out/bin
      - uses: actions/download-artifact@v4
        with:
          name: bin-darwin
          path: out/bin
      - run: scripts/release.sh package "${{ needs.build.outputs.version }}" out
      - name: install/upgrade smoke test (Linux, binary only)
        run: |
          v="${{ needs.build.outputs.version }}"
          dist/install.sh --no-service --prefix "$RUNNER_TEMP/bin" "out/nu_${v}_linux_amd64.tar.gz"
          dist/install.sh --no-service --prefix "$RUNNER_TEMP/bin" "out/nu_${v}_linux_amd64.tar.gz"
          "$RUNNER_TEMP/bin/nu" version
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            out/*.tar.gz
            out/SHA256SUMS
      - name: draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" out/*.tar.gz out/SHA256SUMS
